name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@d42f2215bbd0f27a4820f256757d60c612874dcb
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            configs/platforms.bzl
            crosstool/osx_cc_configure.bzl
            crosstool/setup.bzl
            crosstool/setup_internal.bzl
            lib/private/toolchain_flags.bzl
            lib/providers.bzl
            rules/private/apple_genrule.bzl
            rules/rules.doc.bzl
            rules/toolchain_substitution.bzl
            rules/universal_binary.bzl
            toolchain/toolchain_env.bzl
            xcode/available_xcodes.bzl
            xcode/private/providers.bzl
            xcode/xcode_sdk_variant.bzl
            xcode/xcode_version.bzl
