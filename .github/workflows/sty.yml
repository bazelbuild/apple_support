name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Use 0.2.26 with C++ compilation context contracts while bazelbuild/rules_cc#940 is in review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tamird/rules_cc
          ref: 64691a26df458f40a5922a79550682562f688ac5
          path: .sty-rules-cc
          persist-credentials: false
      - run: echo 'common --override_module=rules_cc=.sty-rules-cc' > user.bazelrc
      - uses: tamird/sty@673feba20c22eaf85d9a3652f6e7a7f1b10b6554
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            configs/platforms.bzl
            crosstool/osx_cc_configure.bzl
            crosstool/setup.bzl
            crosstool/setup_internal.bzl
            crosstool/universal_exec_tool.bzl
            lib/private/toolchain_flags.bzl
            lib/providers.bzl
            rules/apple_genrule.bzl
            rules/private/apple_genrule.bzl
            rules/rules.doc.bzl
            rules/toolchain_substitution.bzl
            rules/universal_binary.bzl
            test/apple_support_test.bzl
            test/binary_tests.bzl
            test/test_data/framework_includes_provider.bzl
            test/universal_binary_test.bzl
            toolchain/dynamic_toolchain_info.bzl
            toolchain/toolchain_env.bzl
            tools/http_dmg/private/tests/http_dmg_test_deps.bzl
            tools/http_dmg/private/tests/http_dmg_test_extensions.bzl
            xcode/available_xcodes.bzl
            xcode/private/providers.bzl
            xcode/xcode_sdk_variant.bzl
            xcode/xcode_version.bzl
