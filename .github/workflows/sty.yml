name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@97770c522e785be5a8d10d7b67ceb53f60eabf70
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            configs/platforms.bzl
            crosstool/setup.bzl
            lib/providers.bzl
            rules/rules.doc.bzl
            rules/toolchain_substitution.bzl
            xcode/available_xcodes.bzl
            xcode/private/providers.bzl
            xcode/xcode_sdk_variant.bzl
            xcode/xcode_version.bzl
