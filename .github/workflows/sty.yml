name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@ec7c566c6abed0c87bc1bd5c82d327371df7fa81
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            lib/apple_support.bzl
            lib/private/providers.bzl
            lib/lipo.bzl
            lib/xcode_support.bzl
